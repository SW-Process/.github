name: Documentation
description: Report missing, unclear, or incorrect documentation
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Which page/file/section is affected? (link or path)
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Issue
      description: What's wrong, missing, or unclear?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
      description: How should it be fixed or improved?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Anything else that helps (screenshots, related issues, etc.).
    validations:
      required: false
