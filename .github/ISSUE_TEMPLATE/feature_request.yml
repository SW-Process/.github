name: Feature request
description: Suggest a new feature or enhancement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve? Why is it needed?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or change you'd like to see.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design reference
      description: Link what the work must follow — the SRS section, a spec in docs/superpowers/specs/, a page in docs/design/ (API, ER, class or sequence diagram) or the mockup. If no design applies, write "None needed:" and why.
      placeholder: |
        - SRS §4.2, FR-20
        - API: docs/design/api.md, GET /api/admin/settings/fairness-prefilter
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Outcomes a reviewer can test. The issue is done when every box is ticked.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: traceability
    attributes:
      label: Traceability
      description: The requirement this implements. Set the same FR in the board's FR field.
      placeholder: Maps to FR-20 (SRS §4.2 AI Summary & Fairness)
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: '"Blocked by #…" or "Part of #…", or "None". A blocked issue stays in Backlog.'
      placeholder: Blocked by #116 (thresholds API)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots here.
    validations:
      required: false
